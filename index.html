<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="VapeCatalog — каталог вейп-шопов: жидкости, одноразки, POD-системы и аксессуары. Соберите заказ прямо в Telegram.">
  <title>SibirDistro — каталог ароматизаторов</title>
  <script>
    // Тема применяется до отрисовки, чтобы не было «мигания»
    (function () {
      try {
        if (localStorage.getItem('vape_theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="dns-prefetch" href="//picsum.photos">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-titles">
        <h1>Sibir Distro</h1>
        <p class="subtitle">Каталог ароматизаторов</p>
      </div>
      <div class="header-actions">
        <span id="countLabel" class="count-label">0 брендов</span>
        <button id="refreshBtn" class="header-round-btn" type="button" aria-label="Обновить каталог" title="Обновить каталог">🔄</button>
        <button id="exportBtn" class="header-round-btn" type="button" aria-label="Экспорт выборки" title="Скопировать прайс текущей выборки">📤</button>
        <button id="shareBtn" class="header-round-btn" type="button" aria-label="Поделиться каталогом" title="Скопировать ссылку на каталог">🔗</button>
        <button id="luckyBtn" class="lucky-btn" type="button" aria-label="Мне повезёт" title="Мне повезёт">🎲</button>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Сменить тему" title="Сменить тему">🌙</button>
        <button id="cartBtn" class="header-round-btn cart-btn" type="button" aria-label="Корзина" title="Корзина">
          <span aria-hidden="true">🛒</span>
          <span id="cartBadge" class="cart-badge hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Прелоадер -->
  <div id="loader" class="loader" aria-hidden="false">
    <div class="loader-spinner"></div>
    <p>Загружаем каталог…</p>
  </div>

  <main class="main">
    <section class="search-section" aria-label="Поиск и фильтры">
      <div class="search-row">
        <div class="search-wrap">
          <input
            id="searchInput"
            class="search-input"
            type="text"
            inputmode="search"
            placeholder="Поиск по вкусу или бренду…"
            aria-label="Поиск по каталогу"
            autocomplete="off"
          >
          <button id="searchClear" class="search-clear hidden" type="button" aria-label="Очистить поиск" title="Очистить поиск">✕</button>
        </div>
        <div class="reset-wrap">
          <button id="resetBtn" class="reset-btn hidden" type="button" title="Сбросить фильтры">↺ Сбросить</button>
        </div>
      </div>
      <div id="chips" class="chips" role="group" aria-label="Категории товаров"></div>
      <div id="chips2" class="chips chips2" role="group" aria-label="Бренды"></div>
      <div id="activeFilters" class="active-filters" role="group" aria-label="Активные фильтры" hidden></div>
    </section>

    <section aria-label="Каталог брендов">
      <!-- Скелетон первой загрузки: 4 серые карточки-заглушки -->
      <div id="skeleton" class="skeleton" aria-hidden="true">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <div id="catalog" class="catalog"></div>
      <button id="loadMoreBtn" class="load-more-btn" type="button" hidden>Показать ещё</button>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-emoji" aria-hidden="true">🔍</div>
        <p>Ничего не найдено</p>
        <p class="empty-sub">Попробуйте изменить запрос или сбросить фильтры</p>
        <button id="emptyResetBtn" class="empty-reset-btn" type="button">Сбросить фильтры</button>
      </div>
    </section>
  </main>

  <button id="toTop" class="to-top" type="button" aria-label="Наверх" title="Наверх">↑</button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Модалка бренда: список всех вкусов бренда -->
  <div id="brandModal" class="modal" aria-hidden="true">
    <div class="modal-overlay" data-close-brand=""></div>
    <div class="modal-panel detail-panel brand-panel" role="dialog" aria-modal="true" aria-label="Вкусы бренда">
      <button id="brandCloseBtn" class="detail-close" type="button" aria-label="Закрыть">✕</button>
      <div id="brandModalBody" class="detail-body brand-body"></div>
      <p class="modal-hint">Esc — закрыть</p>
    </div>
  </div>

  <!-- Модалка деталей товара -->
  <div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-overlay" data-close-detail=""></div>
    <div class="modal-panel detail-panel" role="dialog" aria-modal="true" aria-label="Подробнее о товаре">
      <button id="detailCloseBtn" class="detail-close" type="button" aria-label="Закрыть">✕</button>
      <div id="detailBody" class="detail-body"></div>
      <p class="modal-hint">Esc — закрыть</p>
    </div>
  </div>

  <!-- Модалка корзины: открывается кнопкой 🛒 в шапке -->
  <div id="cartModal" class="modal" aria-hidden="true">
    <div class="modal-overlay" data-close-cart=""></div>
    <div class="modal-panel cart-panel" role="dialog" aria-modal="true" aria-label="Корзина">
      <div class="modal-head">
        <span class="modal-head-title">Корзина</span>
        <span id="cartModalCount" class="cart-head-count"></span>
      </div>
      <button id="cartCloseBtn" class="detail-close" type="button" aria-label="Закрыть">✕</button>
      <div id="cartModalBody" class="cart-modal-body"></div>
      <p class="modal-hint">Esc — закрыть</p>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
